name: Publish

# Manual release — cut a version tag on main.
# Merges to v2 are handled automatically by publish-v2.yml.
on:
  push:
    tags: ["v*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Skip if tag is not on main
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor ${{ github.ref }} origin/main; then
            echo "Tag is not on main — skipping (handled by publish-v2)."
            exit 78
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
          cache: npm

      - run: npm ci
      - run: npm run ci
      - run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
